# Agents cannot change this file: the GitHub App has no Workflows permission.
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pytest
      - run: if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - run: python -m pytest -q
